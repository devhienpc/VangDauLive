<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1628"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD875"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C07C14"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(245,166,35,0.25)" stroke-width="1.5"/>

  <!-- Gold Bar Shape -->
  <g filter="url(#glow)">
    <!-- Top facet -->
    <path d="M22 22 L42 22 L48 30 L16 30 Z" fill="#FFE29A"/>
    <!-- Front facet -->
    <path d="M16 30 L48 30 L44 42 L20 42 Z" fill="url(#goldGrad)"/>
    <!-- Left facet -->
    <path d="M16 30 L20 42 L22 22 Z" fill="#D98A16" opacity="0.8"/>
  </g>

  <!-- Oil Drop Accent -->
  <path d="M42 14 C42 14 36 22 36 26 C36 29.3 38.7 32 42 32 C45.3 32 48 29.3 48 26 C48 22 42 14 42 14 Z" fill="url(#oilGrad)"/>
  <circle cx="44" cy="24" r="1.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
